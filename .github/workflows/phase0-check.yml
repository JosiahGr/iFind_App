name: Phase 0 check

on:
  pull_request:
  push:
    branches:
      - revival/phase-0-expo-baseline

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Expo doctor
        run: npm run doctor
